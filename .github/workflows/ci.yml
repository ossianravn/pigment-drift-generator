name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t pigment-drift .
      - name: Smoke test
        run: |
          docker run -d --name pd -p 8080:80 pigment-drift
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fs http://localhost:8080/ | grep -q "Pigment Drift"
          curl -fsI http://localhost:8080/embed/pigment-drift.min.js | grep -qi "access-control-allow-origin"
